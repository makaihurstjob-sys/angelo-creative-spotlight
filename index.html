<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Angelo | Creative Spotlight</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101216;color:#f4f2ed;font:17px system-ui,sans-serif;padding:40px 20px}
main{max-width:1100px;margin:auto}
small{color:#b9cda3;letter-spacing:.14em}
h1{font-size:clamp(28px,5vw,48px);margin:12px 0 8px}
p{color:#b9bdc4}
a{color:#c9dfb2}
video{width:100%;max-height:75vh;background:#000;border-radius:12px;margin-top:20px}
.versions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.versions button{font:inherit;font-size:15px;color:#f4f2ed;background:#1b1e24;border:1px solid #333944;border-radius:999px;padding:8px 16px;cursor:pointer}
.versions button[aria-pressed="true"]{background:#c9dfb2;color:#101216;border-color:#c9dfb2}
.tag{font-size:12px;letter-spacing:.08em;margin-left:6px;opacity:.75}
.meta{margin-top:12px}
.notes{margin:6px 0 0;padding-left:20px;color:#b9bdc4}
</style>
</head>
<body>
<main>
<small>CREATIVE SPOTLIGHT &middot; BY MAKAI HURST</small>
<h1>Angelo Bowens</h1>
<p>From fixing computers to building worlds.</p>
<div class="versions" id="versions" role="group" aria-label="Edit versions"></div>
<video id="player" controls playsinline preload="metadata"></video>
<p class="meta" id="meta"></p>
<ul class="notes" id="notes"></ul>
</main>
<script>
// Newest first. Add a new entry at the top for each iteration.
const VERSIONS = [
  {id: 'v2', label: 'Version 2', file: 'angelo_v2.mp4', length: '2:03', date: 'Oct 21, 2026',
   notes: ['Cold open on the failed first build; name over the scooter shot',
           'Tighter networking section and a shorter scooter break',
           'Interviewer question sets up the game; physics line tightened',
           'Ends on "something that can outlast me"; larger captions']},
  {id: 'v1', label: 'Version 1', file: 'angelo.mp4', length: '2:21', date: 'Oct 21, 2026',
   notes: ['First full cut']},
];
const player = document.getElementById('player'), bar = document.getElementById('versions'),
      meta = document.getElementById('meta'), notes = document.getElementById('notes');
function show(v) {
  player.src = v.file;
  meta.innerHTML = '';
  meta.append(`${v.label} · ${v.length} · ${v.date} · `);
  const dl = Object.assign(document.createElement('a'), {href: v.file, textContent: 'Download this version'});
  dl.setAttribute('download', '');
  meta.append(dl);
  notes.replaceChildren(...v.notes.map(n => Object.assign(document.createElement('li'), {textContent: n})));
  for (const b of bar.children) b.setAttribute('aria-pressed', String(b.dataset.id === v.id));
  history.replaceState(null, '', '#' + v.id);
}
VERSIONS.forEach((v, i) => {
  const b = document.createElement('button');
  b.dataset.id = v.id;
  b.textContent = v.label;
  if (i === 0) b.append(Object.assign(document.createElement('span'), {className: 'tag', textContent: 'LATEST'}));
  b.onclick = () => show(v);
  bar.append(b);
});
show(VERSIONS.find(v => '#' + v.id === location.hash) || VERSIONS[0]);
</script>
</body>
</html>
